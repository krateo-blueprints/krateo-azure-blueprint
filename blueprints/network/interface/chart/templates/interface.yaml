{{- /*
Renders a native Azure Service Operator NetworkInterface custom resource from the Composition spec.

The Composition spec (.Values) mirrors the ASO NetworkInterface spec, so it passes through verbatim --
including `owner` (the parent resource group / resource, required by ASO) and `location`, which
are part of the resource spec rather than Krateo wiring. `credentialFrom` IS Krateo-wiring and
becomes the serviceoperator.azure.com/credential-from annotation; when empty the annotation is
omitted and ASO resolves the credential from the namespace, then globally. `global` (injected by
Krateo/Helm) is omitted so it never leaks into the NetworkInterface spec.
Generated by tools/asogen.
*/ -}}
apiVersion: network.azure.com/v1api20240301
kind: NetworkInterface
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-network-interface.labels" . | nindent 4 }}
  {{- with .Values.credentialFrom }}
  annotations:
    serviceoperator.azure.com/credential-from: {{ . | quote }}
  {{- end }}
{{- $spec := omit .Values "credentialFrom" "global" }}
{{- if $spec }}
spec:
{{ toYaml $spec | indent 2 }}
{{- else }}
spec: {}
{{- end }}

apiVersion: v2
# Generated by tools/asogen from the Azure Service Operator Snapshot CRD (appconfiguration.azure.com).
#
# Renders a native appconfiguration.azure.com/v20240601 Snapshot resource; Azure Service Operator
# reconciles it into the real Azure resource.
#
# This CRD serves 2 versions upstream (ASO publishes a dated GA version, a legacy
# alias and an internal *storage conversion version per API release). This blueprint targets the
# newest GA, non-storage version; preview versions are never targeted.
#
# Composition Kind: AzureAppconfigurationSnapshot (plural azureappconfigurationsnapshots) in the composition.krateo.io group.
# The Composition spec mirrors the Snapshot spec; core-provider builds the Composition
# CRD from values.schema.json only.
name: azure-appconfiguration-snapshot
description: A Krateo blueprint that provisions an Azure Appconfiguration Snapshot via Azure Service Operator. Requires Azure Service Operator and Azure credentials to be installed/configured beforehand (see repo docs).
type: application

# Drives the Composition CRD version (0.1.0 -> v0-1-0). Stamped by CI.
version: CHART_VERSION
# ASO CRD version this blueprint targets.
appVersion: "v20240601"

home: https://krateo.io
# An ABSOLUTE https URL serving the image itself. A /blob/ URL is a GitHub HTML page, not an SVG:
# publish-chart.yaml's channel gate only checks the https scheme, so a blob URL passes the gate and
# renders a broken Marketplace card with nothing failing. Must also be the canonical org.
icon: "https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg"
keywords:
  - azure
  - appconfiguration
  - snapshot
  - azure-service-operator
sources:
  - https://github.com/krateo-blueprints/krateo-azure-blueprint
annotations:
  krateoSupportedVersion: "2.7.0"
